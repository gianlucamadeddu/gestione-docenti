<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Orario — Gestione Docenti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <style>
        /* ═══════════════════════════════════════════
           ORARIO DOCENTE — STESSI STILI DI CALENDARIO
           ═══════════════════════════════════════════ */

        .orario-wrapper {
            background: #FFFFFF;
            border: 1px solid #DDD9D0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .orario-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .orario-table thead th {
            background: #1B4332;
            color: #FFFFFF;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 12px;
            text-align: center;
            letter-spacing: 0.3px;
            border-right: 1px solid rgba(255,255,255,0.15);
        }

        .orario-table thead th:last-child { border-right: none; }

        .orario-table thead th.col-fascia {
            width: 100px;
            background: #14322A;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .orario-table tbody td {
            padding: 10px 8px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid #EFEDE8;
            border-right: 1px solid #EFEDE8;
            min-height: 60px;
            height: 60px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13.5px;
        }

        .orario-table tbody td:last-child { border-right: none; }
        .orario-table tbody tr:last-child td { border-bottom: none; }

        .td-fascia {
            background: #F8F6F2;
            font-weight: 600;
            color: #555;
            font-size: 12.5px;
            line-height: 1.3;
        }

        .fascia-inizio {
            font-family: 'Lora', serif;
            font-size: 15px;
            font-weight: 700;
            color: #1B4332;
            display: block;
        }

        .fascia-fine {
            font-size: 11.5px;
            color: #999;
            display: block;
            margin-top: 1px;
        }

        .cella-occupata { background: #F0FAF3; }

        .cella-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .cella-materia {
            font-weight: 600;
            color: #1B4332;
            font-size: 13.5px;
            line-height: 1.2;
        }

        .cella-classe {
            background: #E3F2FD;
            color: #1565C0;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .cella-vuota { color: #DDD; }

        .cella-disabled {
            background: #F5F3EF;
            color: transparent;
        }

        .orario-loading {
            text-align: center;
            padding: 60px 24px;
        }

        .orario-loading .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #EFEDE8;
            border-top-color: #1B4332;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .orario-loading p {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            color: #999;
        }

        .orario-empty {
            text-align: center;
            padding: 48px 24px;
            color: #AAA;
        }

        .orario-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .orario-empty p {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 15px;
            color: #999;
        }

        /* Info box docente */
        .docente-info-box {
            background: #F0FAF3;
            border: 1px solid #D8F3DC;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .docente-info-box .info-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .docente-info-box p {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            color: #333;
        }

        .docente-info-box strong {
            color: #1B4332;
        }

        @media (max-width: 900px) {
            .orario-table thead th.col-fascia { width: 70px; }
            .orario-table thead th { font-size: 12px; padding: 10px 6px; }
            .orario-table tbody td { padding: 8px 4px; font-size: 12px; }
            .fascia-inizio { font-size: 13px; }
            .fascia-fine { font-size: 10px; }
            .cella-materia { font-size: 12px; }
            .cella-classe { font-size: 10px; padding: 1px 6px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar e header creati da initPage() -->

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-body">

            <!-- Info box -->
            <div class="docente-info-box" id="docente-info-box">
                <span class="info-icon">📋</span>
                <p>Il tuo orario scolastico settimanale, <strong id="docente-nome-display">Docente</strong>.</p>
            </div>

            <!-- TABELLA ORARIO -->
            <div class="orario-wrapper">
                <div id="orario-container">
                    <div class="orario-loading" id="orario-loading">
                        <div class="loading-spinner"></div>
                        <p>Caricamento orario…</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/template.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/calendario.js"></script>

</body>
</html>
