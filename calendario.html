<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orario Scolastico — Gestione Docenti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <style>
        /* ═══════════════════════════════════════════
           CALENDARIO / ORARIO SCOLASTICO STYLES
           ═══════════════════════════════════════════ */

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-left label {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .toolbar-left .select {
            min-width: 220px;
        }

        /* Tabella orario */
        .orario-wrapper {
            background: #FFFFFF;
            border: 1px solid #DDD9D0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .orario-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .orario-table thead th {
            background: #1B4332;
            color: #FFFFFF;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 12px;
            text-align: center;
            letter-spacing: 0.3px;
            border-right: 1px solid rgba(255,255,255,0.15);
        }

        .orario-table thead th:last-child {
            border-right: none;
        }

        .orario-table thead th.col-fascia {
            width: 100px;
            background: #14322A;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .orario-table tbody td {
            padding: 10px 8px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid #EFEDE8;
            border-right: 1px solid #EFEDE8;
            min-height: 60px;
            height: 60px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13.5px;
        }

        .orario-table tbody td:last-child {
            border-right: none;
        }

        .orario-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Cella fascia oraria (colonna sinistra) */
        .td-fascia {
            background: #F8F6F2;
            font-weight: 600;
            color: #555;
            font-size: 12.5px;
            line-height: 1.3;
        }

        .fascia-inizio {
            font-family: 'Lora', serif;
            font-size: 15px;
            font-weight: 700;
            color: #1B4332;
            display: block;
        }

        .fascia-fine {
            font-size: 11.5px;
            color: #999;
            display: block;
            margin-top: 1px;
        }

        /* Cella occupata */
        .cella-occupata {
            background: #F0FAF3;
            position: relative;
        }

        .cella-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .cella-materia {
            font-weight: 600;
            color: #1B4332;
            font-size: 13.5px;
            line-height: 1.2;
        }

        .cella-classe {
            background: #E3F2FD;
            color: #1565C0;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .cella-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: none;
            border: none;
            color: #CCC;
            font-size: 14px;
            cursor: pointer;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.15s ease;
            line-height: 1;
        }

        .cella-remove:hover {
            background: #FFEBEE;
            color: #C62828;
        }

        /* Cella vuota disponibile */
        .cella-vuota {
            color: #DDD;
            cursor: default;
        }

        /* Cella fuori range (giorno con meno fasce) */
        .cella-disabled {
            background: #F5F3EF;
            color: transparent;
        }

        .cella-disabled::after {
            content: '';
        }

        /* Empty state dentro la tabella */
        .orario-empty {
            text-align: center;
            padding: 48px 24px;
            color: #AAA;
        }

        .orario-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .orario-empty p {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 15px;
            color: #999;
        }

        /* ── Modal Aggiungi Lezione ── */
        .modal-form-group {
            margin-bottom: 16px;
        }

        .modal-form-group label {
            display: block;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13.5px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .modal-form-group .select,
        .modal-form-group .input {
            width: 100%;
        }

        .modal-error {
            background: #FFEBEE;
            color: #C62828;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }

        .modal-error.visible {
            display: block;
        }

        /* Loading per la tabella */
        .orario-loading {
            text-align: center;
            padding: 60px 24px;
        }

        .orario-loading .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #EFEDE8;
            border-top-color: #1B4332;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .orario-loading p {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .orario-table thead th.col-fascia { width: 70px; }
            .orario-table thead th { font-size: 12px; padding: 10px 6px; }
            .orario-table tbody td { padding: 8px 4px; font-size: 12px; }
            .fascia-inizio { font-size: 13px; }
            .fascia-fine { font-size: 10px; }
            .cella-materia { font-size: 12px; }
            .cella-classe { font-size: 10px; padding: 1px 6px; }
        }

        @media (max-width: 600px) {
            .toolbar { flex-direction: column; align-items: flex-start; }
            .toolbar-left { width: 100%; }
            .toolbar-left .select { min-width: 0; flex: 1; }
        }
    </style>
</head>
<body>

    <!-- Sidebar e header creati da initPage() -->

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-body">

            <!-- TOOLBAR: selettore docente + bottone aggiungi -->
            <div class="toolbar" id="admin-toolbar">
                <div class="toolbar-left">
                    <label for="select-docente">Docente:</label>
                    <select id="select-docente" class="select">
                        <option value="">— Seleziona un docente —</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="btn-aggiungi" disabled>
                    ➕ Aggiungi Lezione
                </button>
            </div>

            <!-- TABELLA ORARIO -->
            <div class="orario-wrapper">
                <div id="orario-container">
                    <div class="orario-loading" id="orario-loading">
                        <div class="loading-spinner"></div>
                        <p>Caricamento orario…</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ═══════ MODAL AGGIUNGI LEZIONE ═══════ -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Aggiungi Lezione</h3>
                <button class="modal-close" id="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-error" id="modal-error"></div>

                <div class="modal-form-group">
                    <label for="modal-giorno">Giorno</label>
                    <select id="modal-giorno" class="select">
                        <option value="">— Seleziona giorno —</option>
                    </select>
                </div>

                <div class="modal-form-group">
                    <label for="modal-fascia">Fascia Oraria</label>
                    <select id="modal-fascia" class="select" disabled>
                        <option value="">— Prima seleziona il giorno —</option>
                    </select>
                </div>

                <div class="modal-form-group">
                    <label for="modal-materia">Materia</label>
                    <input type="text" id="modal-materia" class="input" placeholder="Es. Matematica">
                </div>

                <div class="modal-form-group">
                    <label for="modal-classe">Classe</label>
                    <input type="text" id="modal-classe" class="input" placeholder="Es. 3A">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">Annulla</button>
                <button class="btn btn-primary" id="modal-save">Salva Lezione</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/template.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/calendario.js"></script>

</body>
</html>
