<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orario Scolastico — Gestione Docenti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <style>
        /* ═══════════════════════════════════════════
           CALENDARIO / ORARIO SCOLASTICO STYLES
           ═══════════════════════════════════════════ */

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-left label {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .toolbar-left .select {
            min-width: 180px;
        }

        /* Vista selector styling */
        .vista-selector {
            display: flex;
            border: 1.5px solid #DDD9D0;
            border-radius: 8px;
            overflow: hidden;
            background: #FFFFFF;
        }

        .vista-btn {
            padding: 8px 16px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            transition: all 0.2s ease;
            border-right: 1px solid #EFEDE8;
            white-space: nowrap;
        }

        .vista-btn:last-child {
            border-right: none;
        }

        .vista-btn:hover {
            background: #F8F6F2;
            color: #555;
        }

        .vista-btn.active {
            background: #1B4332;
            color: #FFFFFF;
        }

        /* Tabella orario */
        .orario-wrapper {
            background: #FFFFFF;
            border: 1px solid #DDD9D0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .orario-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .orario-table thead th {
            background: #1B4332;
            color: #FFFFFF;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 12px;
            text-align: center;
            letter-spacing: 0.3px;
            border-right: 1px solid rgba(255,255,255,0.15);
        }

        .orario-table thead th:last-child {
            border-right: none;
        }

        .orario-table thead th.col-fascia {
            width: 100px;
            background: #14322A;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .orario-table tbody td {
            padding: 10px 8px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid #EFEDE8;
            border-right: 1px solid #EFEDE8;
            min-height: 60px;
            height: 60px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13.5px;
        }

        .orario-table tbody td:last-child {
            border-right: none;
        }

        .orario-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Cella fascia oraria (colonna sinistra) */
        .td-fascia {
            background: #F8F6F2;
            font-weight: 600;
            color: #555;
            font-size: 12.5px;
            line-height: 1.3;
        }

        .fascia-inizio {
            font-family: 'Lora', serif;
            font-size: 15px;
            font-weight: 700;
            color: #1B4332;
            display: block;
        }

        .fascia-fine {
            font-size: 11.5px;
            color: #999;
            display: block;
            margin-top: 1px;
        }

        /* Cella occupata */
        .cella-occupata {
            background: #F0FAF3;
            position: relative;
            cursor: default;
        }

        /* Admin: cella cliccabile per modifica */
        .cella-occupata.cella-editable {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .cella-occupata.cella-editable:hover {
            background: #E2F5E9;
        }

        .cella-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .cella-materia {
            font-weight: 600;
            color: #1B4332;
            font-size: 13.5px;
            line-height: 1.2;
        }

        .cella-classe {
            background: #E3F2FD;
            color: #1565C0;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .cella-aula {
            background: #FFF3E0;
            color: #E65100;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .cella-docente {
            background: #F3E5F5;
            color: #6A1B9A;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .cella-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: none;
            border: none;
            color: #CCC;
            font-size: 14px;
            cursor: pointer;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.15s ease;
            line-height: 1;
            z-index: 2;
        }

        .cella-remove:hover {
            background: #FFEBEE;
            color: #C62828;
        }

        /* Cella vuota disponibile */
        .cella-vuota {
            color: #DDD;
            cursor: default;
        }

        /* Cella fuori range (giorno con meno fasce) */
        .cella-disabled {
            background: #F5F3EF;
            color: transparent;
        }

        .cella-disabled::after {
            content: '';
        }

        /* Empty state dentro la tabella */
        .orario-empty {
            text-align: center;
            padding: 48px 24px;
            color: #AAA;
        }

        .orario-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .orario-empty p {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 15px;
            color: #999;
        }

        /* ── Modal Aggiungi/Modifica Lezione ── */
        .modal-form-group {
            margin-bottom: 16px;
        }

        .modal-form-group label {
            display: block;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13.5px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .modal-form-group .select,
        .modal-form-group .input {
            width: 100%;
        }

        .modal-error {
            background: #FFEBEE;
            color: #C62828;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }

        .modal-error.visible {
            display: block;
        }

        /* Loading per la tabella */
        .orario-loading {
            text-align: center;
            padding: 60px 24px;
        }

        .orario-loading .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #EFEDE8;
            border-top-color: #1B4332;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .orario-loading p {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            color: #999;
        }

        /* Badge vista attiva nella toolbar */
        .vista-label {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Gestisci Aule e Classi Modal ── */
        .gestisci-tabs {
            display: flex;
            border-bottom: 2px solid #EFEDE8;
        }

        .gestisci-tab {
            flex: 1;
            padding: 12px 16px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .gestisci-tab:hover {
            color: #555;
            background: #F8F6F2;
        }

        .gestisci-tab.active {
            color: #1B4332;
            border-bottom-color: #1B4332;
        }

        .gestisci-panel {
            padding: 20px 24px;
        }

        .gestisci-add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .gestisci-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 320px;
            overflow-y: auto;
        }

        .gestisci-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #F8F6F2;
            border: 1px solid #EFEDE8;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .gestisci-item:hover {
            border-color: #DDD9D0;
        }

        .gestisci-item-nome {
            flex: 1;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .gestisci-item-input {
            flex: 1;
            padding: 4px 8px;
            border: 1.5px solid #1B4332;
            border-radius: 6px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .gestisci-item-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.15s ease;
            line-height: 1;
            color: #999;
        }

        .gestisci-item-btn:hover {
            background: #EFEDE8;
            color: #333;
        }

        .gestisci-item-btn.btn-delete:hover {
            background: #FFEBEE;
            color: #C62828;
        }

        .gestisci-item-btn.btn-save {
            color: #1B4332;
        }

        .gestisci-item-btn.btn-save:hover {
            background: #D8F3DC;
            color: #1B4332;
        }

        .gestisci-empty {
            text-align: center;
            padding: 24px;
            color: #BBB;
            font-size: 14px;
        }

        .gestisci-item-count {
            font-size: 11px;
            color: #BBB;
            margin-left: 4px;
        }

        /* ── Modal Elenco Studenti ── */
        .studenti-modal {
            max-width: 640px;
        }
        .studenti-classe-group {
            margin-bottom: 20px;
        }
        .studenti-classe-group:last-child {
            margin-bottom: 0;
        }
        .studenti-classe-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #E3F2FD;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .studenti-classe-nome {
            font-family: 'Lora', serif;
            font-size: 16px;
            font-weight: 600;
            color: #1565C0;
        }
        .studenti-classe-count {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #1565C0;
            background: rgba(21, 101, 192, 0.1);
            padding: 2px 10px;
            border-radius: 12px;
        }
        .studenti-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid #F5F3EF;
            transition: background 0.1s;
        }
        .studenti-list-item:last-child {
            border-bottom: none;
        }
        .studenti-list-item:hover {
            background: #FAFAF8;
        }
        .studenti-list-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1B4332;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lora', serif;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .studenti-list-info {
            flex: 1;
            min-width: 0;
        }
        .studenti-list-nome {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .studenti-list-contatti {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .studenti-list-contatti a {
            color: #1B4332;
            text-decoration: none;
        }
        .studenti-list-contatti a:hover {
            text-decoration: underline;
        }
        .studenti-copy-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #D8F3DC;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .studenti-copy-bar span {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13px;
            color: #1B4332;
            font-weight: 500;
        }
        .studenti-copy-btn {
            background: #1B4332;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .studenti-copy-btn:hover {
            background: #245A3F;
        }
        .studenti-empty {
            text-align: center;
            padding: 32px 20px;
            color: #AAA;
        }
        .studenti-empty .empty-icon {
            font-size: 36px;
            margin-bottom: 8px;
            opacity: 0.4;
        }
        .studenti-empty p {
            font-size: 14px;
            color: #999;
        }
        .studenti-loading {
            text-align: center;
            padding: 40px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .orario-table thead th.col-fascia { width: 70px; }
            .orario-table thead th { font-size: 12px; padding: 10px 6px; }
            .orario-table tbody td { padding: 8px 4px; font-size: 12px; }
            .fascia-inizio { font-size: 13px; }
            .fascia-fine { font-size: 10px; }
            .cella-materia { font-size: 12px; }
            .cella-classe { font-size: 10px; padding: 1px 6px; }
            .cella-aula { font-size: 9px; }
            .cella-docente { font-size: 10px; padding: 1px 6px; }
            .vista-btn { padding: 6px 10px; font-size: 12px; }
        }

        @media (max-width: 600px) {
            .toolbar { flex-direction: column; align-items: flex-start; }
            .toolbar-left { width: 100%; flex-direction: column; align-items: stretch; }
            .toolbar-left .select { min-width: 0; }
            .vista-selector { width: 100%; }
            .vista-btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Sidebar e header creati da initPage() -->

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-body">

            <!-- TOOLBAR: vista + selettore + bottoni -->
            <div class="toolbar" id="admin-toolbar">
                <div class="toolbar-left">
                    <!-- Selettore vista -->
                    <div class="vista-selector">
                        <button class="vista-btn active" data-vista="docente" onclick="cambiaVista('docente')">👤 Docente</button>
                        <button class="vista-btn" data-vista="aula" onclick="cambiaVista('aula')">🏫 Aula</button>
                        <button class="vista-btn" data-vista="classe" onclick="cambiaVista('classe')">🎓 Classe</button>
                    </div>

                    <!-- Dropdown dinamico (cambia in base alla vista) -->
                    <select id="select-entita" class="select">
                        <option value="">— Seleziona un docente —</option>
                    </select>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <!-- ★ NUOVO: Pulsante Elenco Studenti ★ -->
                    <button class="btn btn-accent" id="btn-elenco-studenti" style="display:none;" onclick="apriModalStudenti()">
                        👥 Elenco Studenti
                    </button>
                    <button class="btn btn-primary" id="btn-aggiungi" disabled>
                        ➕ Aggiungi Lezione
                    </button>
                    <button class="btn btn-secondary" id="btn-gestisci" title="Gestisci Aule e Classi" onclick="apriGestisci()">
                        ⚙️ Gestisci
                    </button>
                </div>
            </div>

            <!-- TABELLA ORARIO -->
            <div class="orario-wrapper">
                <div id="orario-container">
                    <div class="orario-loading" id="orario-loading">
                        <div class="loading-spinner"></div>
                        <p>Caricamento orario…</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ═══════ MODAL AGGIUNGI / MODIFICA LEZIONE ═══════ -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Aggiungi Lezione</h3>
                <button class="modal-close" id="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-error" id="modal-error"></div>

                <div class="modal-form-group">
                    <label for="modal-giorno">Giorno</label>
                    <select id="modal-giorno" class="select">
                        <option value="">— Seleziona giorno —</option>
                    </select>
                </div>

                <div class="modal-form-group">
                    <label for="modal-fascia">Fascia Oraria</label>
                    <select id="modal-fascia" class="select" disabled>
                        <option value="">— Prima seleziona il giorno —</option>
                    </select>
                </div>

                <div class="modal-form-group">
                    <label for="modal-materia">Materia</label>
                    <input type="text" id="modal-materia" class="input" placeholder="Es. Matematica">
                </div>

                <div class="modal-form-group">
                    <label for="modal-classe">Classe</label>
                    <select id="modal-classe" class="select">
                        <option value="">— Seleziona classe —</option>
                    </select>
                </div>

                <div class="modal-form-group">
                    <label for="modal-aula">Aula</label>
                    <select id="modal-aula" class="select">
                        <option value="">— Seleziona aula —</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">Annulla</button>
                <button class="btn btn-primary" id="modal-save">Salva Lezione</button>
            </div>
        </div>
    </div>

    <!-- ═══════ MODAL GESTISCI AULE E CLASSI ═══════ -->
    <div class="modal-overlay" id="gestisci-overlay">
        <div class="modal" style="max-width:520px;">
            <div class="modal-header">
                <h3 class="modal-title">Gestisci Aule e Classi</h3>
                <button class="modal-close" onclick="chiudiGestisci()">✕</button>
            </div>
            <div class="modal-body" style="padding:0;">
                <!-- Tabs -->
                <div class="gestisci-tabs">
                    <button class="gestisci-tab active" data-tab="aule" onclick="switchGestisciTab('aule')">🏫 Aule</button>
                    <button class="gestisci-tab" data-tab="classi" onclick="switchGestisciTab('classi')">🎓 Classi</button>
                </div>

                <!-- Tab Aule -->
                <div class="gestisci-panel" id="panel-aule">
                    <div class="gestisci-add-row">
                        <input type="text" id="input-nuova-aula" class="input" placeholder="Nome nuova aula…" style="flex:1;" onkeydown="if(event.key==='Enter')aggiungiEntita('aule')">
                        <button class="btn btn-primary btn-sm" onclick="aggiungiEntita('aule')">Aggiungi</button>
                    </div>
                    <div class="gestisci-list" id="lista-aule">
                        <!-- Popolata da JS -->
                    </div>
                </div>

                <!-- Tab Classi -->
                <div class="gestisci-panel" id="panel-classi" style="display:none;">
                    <div class="gestisci-add-row">
                        <input type="text" id="input-nuova-classe" class="input" placeholder="Nome nuova classe…" style="flex:1;" onkeydown="if(event.key==='Enter')aggiungiEntita('classi')">
                        <button class="btn btn-primary btn-sm" onclick="aggiungiEntita('classi')">Aggiungi</button>
                    </div>
                    <div class="gestisci-list" id="lista-classi">
                        <!-- Popolata da JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════ ★ MODAL ELENCO STUDENTI ★ ═══════ -->
    <div class="modal-overlay" id="studenti-overlay">
        <div class="modal studenti-modal">
            <div class="modal-header">
                <h3 class="modal-title" id="studenti-modal-title">👥 Elenco Studenti</h3>
                <button class="modal-close" onclick="chiudiModalStudenti()">✕</button>
            </div>
            <div class="modal-body" id="studenti-modal-body" style="max-height:70vh;overflow-y:auto;">
                <!-- Popolato da JS -->
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/template.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/calendario.js"></script>

</body>
</html>
