<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Mie Ripetizioni — GestioneDocenti</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ══════════════════════════════════════
       CALENDARIO RIPETIZIONI — STILI
       (identici a ripetizioni.html)
       ══════════════════════════════════════ */

    .cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .cal-toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cal-toolbar-center {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 600;
      color: var(--primary);
      text-transform: capitalize;
    }
    .cal-toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #calendar-grid {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .cal-header-row {
      display: flex;
      border-bottom: 2px solid var(--border);
      background: var(--bg);
    }
    .cal-header-cell {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .cal-header-cell:first-child {
      flex: 0 0 56px;
    }
    .cal-header-giorno {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-light);
      letter-spacing: 0.5px;
    }
    .cal-header-numero {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .cal-today-header .cal-header-giorno { color: var(--primary); }
    .cal-today-numero { background: var(--primary) !important; color: #fff !important; }

    .cal-body {
      display: flex;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .cal-time-gutter {
      flex: 0 0 56px;
      position: relative;
      border-right: 1px solid var(--border-light);
    }
    .cal-time-label {
      position: absolute;
      left: 0;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .cal-time-label span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      transform: translateY(-7px);
      background: var(--bg-card);
      padding: 0 2px;
    }

    .cal-day-column {
      flex: 1;
      position: relative;
      border-right: 1px solid var(--border-light);
      min-width: 0;
    }
    .cal-day-column:last-child { border-right: none; }
    .cal-today-column { background: rgba(27, 67, 50, 0.02); }

    .cal-grid-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid var(--border-light);
    }
    .cal-grid-disabled {
      background: repeating-linear-gradient(
        45deg, transparent, transparent 4px,
        rgba(0,0,0,0.015) 4px, rgba(0,0,0,0.015) 8px
      );
    }

    .cal-now-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--danger);
      z-index: 10;
    }
    .cal-now-line::before {
      content: '';
      position: absolute;
      left: -4px;
      top: -4px;
      width: 10px;
      height: 10px;
      background: var(--danger);
      border-radius: 50%;
    }

    .cal-block {
      position: absolute;
      left: 3px;
      right: 3px;
      border-radius: 6px;
      padding: 4px 8px;
      overflow: hidden;
      cursor: pointer;
      z-index: 5;
      transition: box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .cal-block:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .cal-block-ora { font-size: 11px; font-weight: 700; opacity: 0.85; white-space: nowrap; }
    .cal-block-studente { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-block-materia { font-size: 11px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-block-docente { font-size: 10.5px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-block-importo { font-size: 11px; font-weight: 700; margin-top: auto; }

    .cal-legenda {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .legenda-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
    .legenda-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .legenda-nome { font-weight: 500; }

    /* Dettaglio modal */
    .dettaglio-riga {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .dettaglio-riga:last-child { border-bottom: none; }
    .dettaglio-label { flex: 0 0 120px; font-size: 13px; color: var(--text-light); font-weight: 500; }
    .dettaglio-valore { font-size: 14px; color: var(--text); font-weight: 500; }

    /* Info docente readonly */
    .readonly-info {
      background: var(--primary-light);
      color: var(--primary);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .cal-toolbar { flex-direction: column; align-items: stretch; }
      .cal-toolbar-left, .cal-toolbar-right { justify-content: center; }
      .cal-toolbar-center { text-align: center; }
      .cal-time-gutter { flex: 0 0 42px; }
      .cal-header-cell:first-child { flex: 0 0 42px; }
      .cal-time-label span { font-size: 10px; }
      .cal-block { padding: 3px 5px; }
      .cal-block-ora { font-size: 10px; }
      .cal-block-studente { font-size: 11px; }
      .cal-block-materia { font-size: 10px; }
      .cal-block-importo { font-size: 10px; }
      .cal-header-numero { font-size: 16px; width: 30px; height: 30px; }
    }
  </style>
</head>
<body>

  <!-- ═══ CONTENUTO PRINCIPALE ═══ -->
  <div class="main-content">

    <!-- Info sola lettura -->
    <div class="readonly-info">
      📋 Visualizzi le tue ripetizioni in sola lettura. Per modifiche, contatta l'amministrazione.
    </div>

    <!-- Toolbar navigazione -->
    <div class="cal-toolbar">
      <div class="cal-toolbar-left">
        <button class="btn btn-secondary btn-sm" id="btn-prev-week">← Prec</button>
        <button class="btn btn-secondary btn-sm" id="btn-oggi">Oggi</button>
        <button class="btn btn-secondary btn-sm" id="btn-next-week">Succ →</button>
      </div>
      <div class="cal-toolbar-center" id="label-settimana">Caricamento...</div>
      <div class="cal-toolbar-right">
        <!-- Nessun pulsante: sola lettura -->
      </div>
    </div>

    <!-- Griglia calendario -->
    <div id="calendar-grid">
      <div class="loading"><div class="loading-spinner"></div></div>
    </div>

    <!-- Legenda (mostra solo il docente corrente) -->
    <div class="cal-legenda" id="legenda-docenti">
      <span class="text-muted text-sm">Caricamento...</span>
    </div>

  </div>

  <!-- ═══ MODAL FORM (nascosto, serve a ripetizioni.js per non dare errore) ═══ -->
  <div class="modal-overlay" id="modal-overlay-ripetizione" style="display:none!important;">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title-ripetizione"></h3>
        <button class="modal-close" type="button">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-ripetizione">
          <div id="modal-preview"></div>
          <div id="modal-warning"></div>
          <select id="modal-docente"></select>
          <input id="modal-data">
          <input id="modal-ora-inizio">
          <select id="modal-durata"><option value="60">60</option></select>
          <input id="modal-studente">
          <input id="modal-materia">
          <input id="modal-classe">
          <textarea id="modal-note"></textarea>
        </form>
      </div>
      <div class="modal-footer">
        <button id="btn-elimina-ripetizione" style="display:none;"></button>
        <button id="btn-annulla-ripetizione"></button>
        <button id="btn-salva-ripetizione"></button>
      </div>
    </div>
  </div>

  <!-- ═══ MODAL: DETTAGLIO RIPETIZIONE (Docente readonly) ═══ -->
  <div class="modal-overlay" id="modal-overlay-dettaglio">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h3 class="modal-title">Dettaglio Ripetizione</h3>
        <button class="modal-close" type="button">✕</button>
      </div>
      <div class="modal-body" id="dettaglio-contenuto">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-chiudi-dettaglio">Chiudi</button>
      </div>
    </div>
  </div>

  <!-- ═══ SCRIPTS ═══ -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/template.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ripetizioni.js"></script>
</body>
</html>
