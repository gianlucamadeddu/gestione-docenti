<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Gestione Docenti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <style>
        /* ═══════════════════════════════════════════
           DASHBOARD SPECIFIC STYLES
           ═══════════════════════════════════════════ */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #FFFFFF;
            border: 1px solid #DDD9D0;
            border-radius: 12px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(27, 67, 50, 0.08);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }
        .stat-card:nth-child(1)::before { background: #1B4332; }
        .stat-card:nth-child(2)::before { background: #BC6C25; }
        .stat-card:nth-child(3)::before { background: #1565C0; }
        .stat-card:nth-child(4)::before { background: #2D6A4F; }
        .stat-card:nth-child(5)::before { background: #6A1B9A; }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }
        .stat-card:nth-child(1) .stat-icon { background: #D8F3DC; color: #1B4332; }
        .stat-card:nth-child(2) .stat-icon { background: #FEFAE0; color: #BC6C25; }
        .stat-card:nth-child(3) .stat-icon { background: #E3F2FD; color: #1565C0; }
        .stat-card:nth-child(4) .stat-icon { background: #D8F3DC; color: #2D6A4F; }
        .stat-card:nth-child(5) .stat-icon { background: #F3E5F5; color: #6A1B9A; }
        .stat-label {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #7A7A7A;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .stat-value {
            font-family: 'Lora', serif;
            font-size: 32px;
            font-weight: 700;
            color: #1B4332;
            line-height: 1;
        }
        .stat-value.loading { color: #CCC; font-size: 24px; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .section-card {
            background: #FFFFFF;
            border: 1px solid #DDD9D0;
            border-radius: 12px;
            overflow: hidden;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid #EFEDE8;
        }
        .section-title {
            font-family: 'Lora', serif;
            font-size: 18px;
            font-weight: 600;
            color: #1B4332;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .icon { font-size: 20px; }
        .section-badge {
            background: #D8F3DC;
            color: #1B4332;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .section-body {
            padding: 16px 24px 24px;
            max-height: 500px;
            overflow-y: auto;
        }
        .ripetizione-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #F5F3EF;
        }
        .ripetizione-item:last-child { border-bottom: none; }
        .rip-time-block { min-width: 70px; text-align: center; flex-shrink: 0; }
        .rip-time-start {
            font-family: 'Lora', serif;
            font-size: 18px;
            font-weight: 700;
            color: #1B4332;
            line-height: 1.2;
        }
        .rip-time-end {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        .rip-divider {
            width: 3px;
            min-height: 50px;
            background: #BC6C25;
            border-radius: 3px;
            flex-shrink: 0;
            align-self: stretch;
        }
        .rip-details { flex: 1; }
        .rip-studente {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .rip-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
        }
        .badge-materia {
            background: #FEFAE0;
            color: #BC6C25;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid rgba(188, 108, 37, 0.2);
        }
        .badge-classe {
            background: #E3F2FD;
            color: #1565C0;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid rgba(21, 101, 192, 0.2);
        }
        .rip-docente { font-family: 'Source Sans 3', sans-serif; font-size: 13px; color: #777; }
        .rip-docente strong { color: #555; font-weight: 600; }
        .rip-importo {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #2D6A4F;
            margin-top: 4px;
        }
        .docente-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #F5F3EF;
        }
        .docente-item:last-child { border-bottom: none; }
        .docente-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1B4332;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lora', serif;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        .docente-info { flex: 1; }
        .docente-nome {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .docente-materie { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .docente-materie .badge-materia { font-size: 11px; padding: 2px 8px; }
        .docente-tariffe { font-family: 'Source Sans 3', sans-serif; font-size: 13px; color: #777; }
        .docente-tariffe span { color: #2D6A4F; font-weight: 600; }
        .docente-tariffe .sep { color: #CCC; margin: 0 4px; }
        .empty-state { text-align: center; padding: 40px 20px; color: #AAA; }
        .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
        .empty-state p { font-family: 'Source Sans 3', sans-serif; font-size: 15px; color: #999; }
        .skeleton {
            background: linear-gradient(90deg, #F0EDEA 25%, #E8E5E0 50%, #F0EDEA 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-line { height: 16px; margin-bottom: 8px; }
        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        @media (max-width: 1100px) {
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- NESSUN <aside> e <header> statico! Li crea initPage() da template.js -->
    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="page-body">
            <!-- 5 STAT CARDS -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon">👨‍🏫</div>
                    <div class="stat-label">Docenti Attivi</div>
                    <div class="stat-value loading" id="stat-docenti">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎓</div>
                    <div class="stat-label">Studenti Iscritti</div>
                    <div class="stat-value loading" id="stat-studenti">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📚</div>
                    <div class="stat-label">Ripetizioni Oggi</div>
                    <div class="stat-value loading" id="stat-rip-oggi">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🕐</div>
                    <div class="stat-label">Ore Settimana</div>
                    <div class="stat-value loading" id="stat-ore-sett">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💶</div>
                    <div class="stat-label">Importo Settimana</div>
                    <div class="stat-value loading" id="stat-importo-sett">—</div>
                </div>
            </div>
            <!-- DUE COLONNE -->
            <div class="dashboard-grid">
                <!-- SINISTRA — Ripetizioni di Oggi -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">📅</span>
                            Ripetizioni di Oggi
                        </div>
                        <span class="section-badge" id="badge-oggi-count">0</span>
                    </div>
                    <div class="section-body" id="lista-ripetizioni-oggi">
                        <div class="ripetizione-item">
                            <div class="rip-time-block">
                                <div class="skeleton skeleton-line" style="width:50px;height:22px;margin:0 auto 4px;"></div>
                                <div class="skeleton skeleton-line" style="width:40px;height:12px;margin:0 auto;"></div>
                            </div>
                            <div class="rip-divider skeleton" style="background:#EEE;"></div>
                            <div class="rip-details" style="flex:1">
                                <div class="skeleton skeleton-line medium"></div>
                                <div class="skeleton skeleton-line short"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- DESTRA — Docenti e Tariffe -->
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">👥</span>
                            Docenti e Tariffe
                        </div>
                        <span class="section-badge" id="badge-docenti-count">0</span>
                    </div>
                    <div class="section-body" id="lista-docenti">
                        <div class="docente-item">
                            <div class="skeleton" style="width:48px;height:48px;border-radius:50%;flex-shrink:0;"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-line medium"></div>
                                <div class="skeleton skeleton-line short"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/template.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
